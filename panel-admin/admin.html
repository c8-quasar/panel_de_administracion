<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuro & Sésamo | Panel de Administración</title>

    <!-- Fuentes definidas en el diseño de Stitch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 e iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="admin-layout d-flex min-vh-100">

        <!-- Menú lateral izquierdo -->
        <aside class="sidebar d-flex flex-column justify-content-between p-3 p-lg-4">
            <div>
                <div class="d-flex align-items-center gap-3 mb-4 pb-2">
                    <div class="brand-badge d-flex align-items-center justify-content-center">
                        <span>黒</span>
                    </div>
                    <div>
                        <h1 class="brand-title mb-0">Kuro & Sésamo</h1>
                        <small class="brand-subtitle">GESTIÓN DE RECETAS</small>
                    </div>
                </div>

                <nav class="nav flex-column gap-2" aria-label="Navegación del panel">
                    <button class="nav-link active text-start" id="navPanelBtn" type="button">
                        <i class="bi bi-journal-text me-2"></i>Panel de Recetas
                    </button>
                    <button class="nav-link text-start" id="navCrearBtn" type="button">
                        <i class="bi bi-plus-circle me-2"></i>Crear Receta
                    </button>
                </nav>
            </div>

            <div class="pt-4 border-top border-subtle d-flex flex-column gap-2">
                <a href="index.html" class="nav-link text-start">
                    <i class="bi bi-globe me-2"></i>Ver Sitio Público
                </a>
                <button id="btnCerrarSesionSidebar" class="nav-link text-start text-danger-custom" type="button">
                    <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- Área principal del panel -->
        <main class="main-content flex-grow-1 p-3 p-md-4 p-lg-5">

            <header
                class="d-flex flex-wrap justify-content-between align-items-center gap-3 pb-3 mb-4 border-bottom border-subtle">
                <span class="top-tag"><i class="bi bi-layout-text-sidebar me-2"></i>PANEL DE ADMINISTRACIÓN</span>
                <span class="badge rounded-pill bg-white text-dark border px-3 py-2">
                    <i class="bi bi-person-check-fill text-success-custom me-1"></i>Admin Activo
                </span>
            </header>

            <!-- Estado de sesión y conexión a la API -->
            <section
                class="session-banner rounded-3 p-3 mb-4 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="d-flex flex-wrap align-items-center gap-3 small">
                    <span class="fw-semibold text-dark">
                        <i class="bi bi-shield-check text-success-custom me-1"></i>Administrador
                    </span>
                    <span class="badge bg-success-subtle text-success-custom rounded-pill">Sesión Activa —
                        sessionStorage</span>
                    <span class="text-muted d-none d-md-inline">
                        <i class="bi bi-hdd-network me-1"></i>API: <code id="apiEndpointLabel"></code>
                    </span>
                </div>
                <button id="btnCerrarSesionTop"
                    class="btn btn-sm btn-link text-danger-custom text-decoration-none fw-semibold p-0" type="button">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                </button>
            </section>

            <footer class="visually-hidden">Panel administrativo de Kuro & Sésamo</footer>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script src="js/admin.js"></script>
</body>

</html>
