<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Administración  Kuro & Sésamo · Atelier</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    
    <div class="container">
      <main>
        <img
          src="../img/logo.png"
          alt="Logo de Kuro & Sésamo"
          class="img-fluid mb-3"
          width="200"
        />

        <form id="form-login">
          <div>
            <label class="form-label" for="email">Correo Electrónico:</label>
            <input
              type="email"
              class="form-control"
              id="email"
              required
              placeholder="Escribe tu correo electrónico"
            />
          </div>

          <div>
            <label class="form-label" for="password">Contraseña:</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
              placeholder="Escribe tu contraseña"
            />
          </div>

          <div id="mensaje-error" role="alert" hidden></div>

          <div class="login-options">
            <label class="remember-option" for="remember">
              <input class="form-check-input" type="checkbox" id="remember" />
              <span>Recordar en este equipo</span>
            </label>
            <span class="connection-status" id="connection-status" aria-live="polite"></span>
          </div>

          <button class="btn login-submit" type="submit">
            Iniciar Sesión en el Panel <span aria-hidden="true">&rarr;</span>
          </button>
        </form>

        <div class="login-divider"><span>GASTRONOMÍA &amp; RIGOR</span></div>
        <a class="back-link" href="../index.html">
          <span aria-hidden="true">&larr;</span> Volver al recetario público
        </a>
      </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
